<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Trip & Tour - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-page">
        <section class="main-panel reset-pw-panel" id="reset-password">
            <div class="form-card">
                <h2>RESET PASSWORD</h2>

                <form action="#" method="post">
                    <input type="email" name="email" placeholder="Enter your email" required>
                    <input type="password" name="new-password" placeholder="Enter new password" required>
                    <input type="password" name="confirm-password" placeholder="Confirm new password" required>
                    <button type="submit" class="btn-primary" ><a href="reset-pw-sucess.html" target="_blank">Reset Password</a></button>
                </form>

                <p class="switch-login-signup">
                    Remembered your password? <a href="login.html">Login here</a>
                </p>
            </div>

        </section>
</body>
</html>
