<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning Trip & Tour - Log in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-page">
      <section class="main-panel login-panel" id="login">
        <div class="form-card">
          <h2>LOGIN</h2>

          <form action="#" method="post">
            <input
              type="text"
              name="username"
              placeholder="Username/Email"
              required
            />
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />

            <button type="submit" class="btn-primary">Login</button>
          </form>
          <p class="forget-pw">
            <a href="reset-pw.html" target="_blank">Forgot Password?</a>
          </p>
          <p class="switch-login-signup">
            Don't have an account? <a href="signup.html" >Sign Up here</a>
          </p>
        </div>
      </section>
  </body>
</html>
